<title>Temporal Manifolds — Debug Explorer</title>
<style>
  :root {
    --bg:#F7F8F7; --panel:#FFFFFF; --ink:#1C2321; --ink2:#57625F; --ink3:#8B9793;
    --line:#E2E6E2; --accent:#1F8A85; --accentInk:#14615D; --chip:#EDF1EE;
    --user:#F0F2F0; --asst:#E7F2F1; --hl:#FFF6DC; --surface:#FCFCFB;
  }
  @media (prefers-color-scheme: dark){ :root{ --bg:#0F1413; --panel:#171E1C; --ink:#E6EBE9;
    --ink2:#A2AEAA; --ink3:#6C7975; --line:#26302B; --accent:#3BB8B0; --accentInk:#6ED4CC;
    --chip:#202926; --user:#1C2422; --asst:#193230; --hl:#3A331A; --surface:#131917; } }
  :root[data-theme="dark"]{ --bg:#0F1413; --panel:#171E1C; --ink:#E6EBE9; --ink2:#A2AEAA;
    --ink3:#6C7975; --line:#26302B; --accent:#3BB8B0; --accentInk:#6ED4CC; --chip:#202926;
    --user:#1C2422; --asst:#193230; --hl:#3A331A; --surface:#131917; }
  :root[data-theme="light"]{ --bg:#F7F8F7; --panel:#FFFFFF; --ink:#1C2321; --ink2:#57625F;
    --ink3:#8B9793; --line:#E2E6E2; --accent:#1F8A85; --accentInk:#14615D; --chip:#EDF1EE;
    --user:#F0F2F0; --asst:#E7F2F1; --hl:#FFF6DC; --surface:#FCFCFB; }

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  code,.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace}
  .app{display:flex;flex-direction:column;height:100vh}
  header{display:flex;align-items:center;gap:14px;padding:10px 16px;
    border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
  header h1{font-size:15px;margin:0;font-weight:650}
  header h1 span{color:var(--accentInk)}
  .tabs{display:flex;gap:2px}
  .tab{border:none;background:none;color:var(--ink2);padding:7px 12px;border-radius:6px;
    cursor:pointer;font:inherit;font-weight:550}
  .tab:hover{background:var(--chip)}
  .tab.on{background:var(--accent);color:#fff}
  .spacer{flex:1}
  select,input[type=range]{font:inherit;color:var(--ink);background:var(--panel);
    border:1px solid var(--line);border-radius:6px;padding:5px 8px}
  label.ctl{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:6px}
  main{flex:1;overflow:hidden;display:flex}
  .pane{overflow:auto;padding:16px}
  .left{width:330px;min-width:280px;border-right:1px solid var(--line);background:var(--panel)}
  .right{flex:1}
  .hidden{display:none !important}

  .filter{width:100%;margin-bottom:10px;padding:6px 9px;border:1px solid var(--line);
    border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
  .slist{display:flex;flex-direction:column;gap:4px}
  .sitem{padding:8px 10px;border-radius:6px;cursor:pointer;border:1px solid transparent}
  .sitem:hover{background:var(--chip)}
  .sitem.on{border-color:var(--accent);background:var(--chip)}
  .sitem .t{font-weight:600;font-size:13px}
  .sitem .m{font-size:11.5px;color:var(--ink3)}
  .badge{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:99px;
    background:var(--chip);color:var(--ink2);margin-left:6px;vertical-align:1px}
  .badge.ok{background:var(--accent);color:#fff}

  .turn{display:flex;gap:10px;margin-bottom:10px;max-width:900px}
  .avatar{flex:0 0 60px;text-align:right;font-size:11px;color:var(--ink3);padding-top:8px}
  .bubble{flex:1;border:1px solid var(--line);border-radius:8px;padding:10px 14px;
    background:var(--user);white-space:pre-wrap;font-size:13.5px}
  .turn.assistant .bubble{background:var(--asst)}
  .turnmeta{margin:-4px 0 10px 70px;font-size:11.5px;color:var(--ink2)}
  .turnmeta .chipx{background:var(--chip);border:1px solid var(--line);border-radius:99px;
    padding:1px 8px;margin-right:6px}
  .turnmeta .warn{color:#B4540A}

  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line)}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);
    position:sticky;top:0;background:var(--panel);cursor:pointer;white-space:nowrap}
  tr.click{cursor:pointer}
  tr.click:hover td{background:var(--chip)}
  td.num{font-variant-numeric:tabular-nums;font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
  .panelbox{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .panelhead{padding:10px 14px;border-bottom:1px solid var(--line);font-weight:600;font-size:13px}
  .scrollx{overflow:auto;max-height:calc(100vh - 210px)}

  .prompttext{white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;
    background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;
    max-width:860px;line-height:1.6}
  .kv{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
  .kv .chipx{background:var(--chip);border:1px solid var(--line);border-radius:99px;
    padding:3px 10px;font-size:12px;color:var(--ink2)}
  .kv .chipx b{color:var(--ink)}

  /* boundaries strip */
  .lanes{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px 4px}
  .lane{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .lane .lname{flex:0 0 110px;font-size:11px;color:var(--ink2);text-align:right;
    font-family:ui-monospace,Menlo,monospace}
  .lane .track{flex:1;position:relative;height:16px;background:var(--chip);border-radius:4px}
  .mark{position:absolute;top:2px;width:3px;height:12px;border-radius:1px;background:var(--accent)}
  .mark.user{background:var(--ink3)}
  .mark:hover{outline:2px solid var(--accentInk)}

  /* geometry */
  .geo{display:flex;gap:14px;height:100%}
  .geo-main{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
  .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;
    background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .seg button{border:none;background:var(--panel);color:var(--ink2);padding:5px 10px;
    cursor:pointer;font:inherit;font-size:12.5px}
  .seg button.on{background:var(--accent);color:#fff}
  #c3d{flex:1;min-height:340px;background:var(--surface);border:1px solid var(--line);
    border-radius:8px;cursor:grab;touch-action:none;width:100%}
  .geo-side{width:250px;flex:0 0 250px;display:flex;flex-direction:column;gap:10px;overflow:auto}
  .legend{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
  .legend h4{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3)}
  .lrow{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-bottom:5px;color:var(--ink2)}
  .sw{width:12px;height:12px;border-radius:3px;flex:0 0 12px;border:1px solid rgba(0,0,0,.15)}
  .evr{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--ink3)}
  #tip{position:fixed;pointer-events:none;background:var(--panel);border:1px solid var(--line);
    border-radius:6px;padding:8px 11px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.18);
    display:none;z-index:9;max-width:280px}
  #tip b{display:block;margin-bottom:2px}
  #tip .mono{color:var(--ink3);font-size:11px}
  .hint{font-size:11.5px;color:var(--ink3)}
</style>

<div class="app">
<header>
  <h1>temporal-manifolds <span>debug explorer</span></h1>
  <nav class="tabs" id="tabs"></nav>
  <div class="spacer"></div>
  <label class="ctl">model
    <select id="modelSel"></select>
  </label>
</header>
<main id="main"></main>
</div>
<div id="tip"></div>

<script id="DATA" type="application/json">__DATA__</script>
<script>
"use strict";
const DATA = JSON.parse(document.getElementById("DATA").textContent);
// rehydrate compact encodings: prompt-text dedupe + b64-packed idx arrays
(function(){
  const pt = DATA.promptTexts || [];
  for (const m of DATA.models || []){
    for (const s of m.samples || []){
      if (s.turns && s.turns.length && s.turns[0].pt !== undefined){
        s.turns[0].text = pt[s.turns[0].pt];
        delete s.turns[0].pt;
      }
    }
    for (const kd of Object.values(m.kinds || {})){
      for (const fit of Object.values(kd.fits || {})){
        if (fit.idxb64){
          const bin = atob(fit.idxb64), n = bin.length >> 1, a = new Array(n);
          for (let i = 0; i < n; i++) a[i] = bin.charCodeAt(2*i) | (bin.charCodeAt(2*i+1) << 8);
          fit.idx = a; delete fit.idxb64;
        }
      }
    }
  }
})();
const DEFAULT_MODEL = Math.max(0, DATA.models.findIndex(m => m.default));
const TASK_COLORS = {climate_city:"#3E6FD9", dinner_party:"#D6493F", marathon:"#1F8A4C", knowledge_archive:"#9B59C9"};
const TASK_GLYPH  = {climate_city:"circle", dinner_party:"triangle", marathon:"square", knowledge_archive:"diamond"};
const PHRASE_COLORS = {available_time:"#3E6FD9", deadline:"#D6493F"};
// ordered log-time ramp (plasma-derived, clamped ends for both surfaces)
// turbo (clipped ends): blue -> cyan -> green -> yellow -> orange -> red.
// High local hue contrast so nearby quantiles stay distinguishable;
// cold = near-term, hot = far future.
const TIME_RAMP = ["#4458cb","#3e9bfe","#18d6cb","#46f884","#a2fc3c","#e1dd37","#fea130","#ef5a11","#c42503"];
// discrete time-scale classes (same as probe_timescale.py)
const TSCALE_BOUNDS = [1/365, 7/365, 1/12, 1, 10]; // upper bounds, years
const TSCALE_NAMES = ["hours","days","weeks","months","years","decades+"];
const TSCALE_COLORS = ["#4458cb","#18d6cb","#46f884","#e1dd37","#fea130","#c42503"];
function tscaleClass(years){
  if (years == null || years <= 0) return null;
  for (let i = 0; i < TSCALE_BOUNDS.length; i++) if (years < TSCALE_BOUNDS[i]) return i;
  return TSCALE_BOUNDS.length;
}
function rowPredY(row, field){ // per-turn probe prediction (predY or predL)
  field = field || "predY";
  const s = M().samples[row.si];
  if (!s) return null;
  const cache = "_cache_" + field;
  if (!s[cache]){
    s[cache] = {};
    for (const t of s.turns) if (t[field] != null) s[cache][t.i] = t[field];
  }
  return s[cache][row.turn] ?? null;
}
const KIND_ORDER = ["turn_end","turn_start","role","think_close","post_turn_end_nl","post_role_nl","think_open"];
const _hex2rgb = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
function lerpRamp(f){ // continuous color along TIME_RAMP, f in [0,1]
  f = Math.max(0, Math.min(1, f));
  const x = f * (TIME_RAMP.length - 1), i = Math.min(Math.floor(x), TIME_RAMP.length - 2), t = x - i;
  const a = _hex2rgb(TIME_RAMP[i]), b = _hex2rgb(TIME_RAMP[i+1]);
  return `rgb(${a.map((v,k)=>Math.round(v+(b[k]-v)*t)).join(",")})`;
}
const RAMP_CSS = `linear-gradient(to right, ${TIME_RAMP.join(",")})`;
// diverging ramp for ratios centered at 1x: below budget (cool) .. neutral .. over budget (warm)
const DIV_RAMP = ["#2C5FC4","#7C93D8","#C6CAD0","#D8917C","#C43D2C"];
const DIV_CSS = `linear-gradient(to right, ${DIV_RAMP.join(",")})`;
function lerpDiv(f){
  f = Math.max(0, Math.min(1, f));
  const x = f * (DIV_RAMP.length - 1), i = Math.min(Math.floor(x), DIV_RAMP.length - 2), t = x - i;
  const a = _hex2rgb(DIV_RAMP[i]), b = _hex2rgb(DIV_RAMP[i+1]);
  return `rgb(${a.map((v,k)=>Math.round(v+(b[k]-v)*t)).join(",")})`;
}

const state = { model:DEFAULT_MODEL, tab:"prompts", sample:0,
  geo:{depth:2, kind:"role", scope:"steps", centered:false, color:"step", method:"pca", rollout:"all", cshow:"both", auto:false, size:6} };
function condShown(row){ // condition display filter (joint entries)
  const c = state.geo.cshow;
  return c === "both" || !M().joint || row.cond === c;
}
const modelSeeds = () => [...new Set(M().samples.map(s=>s.seed??0))].sort((a,b)=>a-b);

const M = () => DATA.models[state.model];
const fmtYears = y => {
  if (y == null) return "—";
  if (y >= 1) return y >= 10 ? Math.round(y) + " y" : (Math.round(y*10)/10) + " y";
  const d = y * 365.25;
  if (d >= 30) return Math.round(d/30.44) + " mo";
  if (d >= 1) return Math.round(d) + " d";
  return Math.round(d*24) + " h";
};
const esc = s => (s??"").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;");

/* ---------- header ---------- */
const TABS = [["prompts","1 · Prompts"],["conv","2 · Conversation"],["bounds","3 · Boundaries"],["geo","4 · Geometry 3D"],["stats","5 · Stats"],["mfa","6 · MFA Regions"]];
function renderHeader(){
  document.getElementById("tabs").innerHTML = TABS.map(([id,l]) =>
    `<button class="tab ${state.tab===id?"on":""}" data-tab="${id}">${l}</button>`).join("");
  document.querySelectorAll("#tabs .tab").forEach(b =>
    b.onclick = () => { state.tab = b.dataset.tab; render(); });
  const sel = document.getElementById("modelSel");
  sel.innerHTML = DATA.models.map((m,i) =>
    `<option value="${i}" ${i===state.model?"selected":""}>${m.name} (${m.samples.length})</option>`).join("");
  sel.onchange = () => { state.model = +sel.value; state.sample = 0; syncGeoOptions(); render(); };
}

/* ---------- sample list (shared by conv & bounds) ---------- */
function sampleList(onPick){
  const items = M().samples.map((s,i) => `
    <div class="sitem ${i===state.sample?"on":""}" data-i="${i}">
      <div class="t">${esc(s.task)} · ${esc(s.hLabel)}
        ${modelSeeds().length>1?`<span class="badge">r${s.seed??0}</span>`:""}
        ${s.completed?'<span class="badge ok">completed</span>':`<span class="badge">${s.expanded}/${s.planned||"?"} steps</span>`}</div>
      <div class="m mono">${esc(s.promptId)}<br>${s.nTok} tok · ${s.turns.length} turns · ${esc(s.phrasing)}</div>
    </div>`).join("");
  return `<input class="filter" id="sfilter" placeholder="filter: task, horizon, phrasing…">
    <div class="slist" id="slist">${items}</div>`;
}
function wireSampleList(){
  document.querySelectorAll(".sitem").forEach(el =>
    el.onclick = () => { state.sample = +el.dataset.i; render(); });
  const f = document.getElementById("sfilter");
  if (f) f.oninput = () => {
    const q = f.value.toLowerCase();
    document.querySelectorAll(".sitem").forEach(el =>
      el.classList.toggle("hidden", !el.textContent.toLowerCase().includes(q)));
  };
}

/* ---------- tab 1: prompts ---------- */
function renderPrompts(){
  const s = M().samples[state.sample];
  const multi = modelSeeds().length > 1;
  const rows = M().samples.map((x,i)=>`
    <tr class="click ${i===state.sample?"on":""}" data-i="${i}">
      <td class="mono">${esc(x.promptId)}</td>${multi?`<td class="num">r${x.seed??0}</td>`:""}<td>${esc(x.task)}</td>
      <td class="num">${esc(x.hLabel)}</td><td>${esc(x.phrasing)}</td>
      <td class="num">${x.nTok}</td><td class="num">${x.expanded}/${x.planned||"?"}</td>
      <td>${x.completed?"✓":"—"}</td></tr>`).join("");
  return `<div class="pane left">
      <div class="panelbox"><div class="panelhead">prompt grid — ${M().samples.length} samples</div>
      <div class="scrollx"><table>
        <thead><tr><th>prompt id</th>${modelSeeds().length>1?"<th>roll</th>":""}<th>task</th><th>total horizon</th><th>phrasing</th><th>tok</th><th>steps</th><th>done</th></tr></thead>
        <tbody>${rows}</tbody></table></div></div>
    </div>
    <div class="pane right">
      <div class="kv">
        <span class="chipx">uid <b class="mono">${esc(s.uid)}</b></span>
        <span class="chipx">total horizon <b>${esc(s.hLabel)}</b> (${fmtYears(s.hYears)})</span>
        <span class="chipx">run <b class="mono">${esc(M().run)}</b></span>
        <span class="chipx">engine <b>${esc(M().engine)}</b></span>
      </div>
      <div class="prompttext">${esc(s.turns[0].text)}</div>
      <p class="hint">This is the exact first user turn sent to the model (before chat templating).
      The horizon sentence and format contract vary per sample; click a row to inspect another prompt.</p>
    </div>`;
}
function wirePrompts(){
  document.querySelectorAll("tr.click").forEach(tr =>
    tr.onclick = () => { state.sample = +tr.dataset.i; render(); });
}

/* ---------- tab 2: conversation ---------- */
function predChip(t){
  // activation probe's read-out of this step's horizon vs what the model wrote
  let verdict = "";
  if (t.shYears){
    const r = t.predY / t.shYears;
    if (r >= 1/1.3 && r <= 1.3) verdict = " — matches";
    else if (r > 1) verdict = ` — ${Number(r.toPrecision(2))}× longer than written`;
    else verdict = ` — ${Number((1/r).toPrecision(2))}× shorter than written`;
  }
  return `<span class="chipx" style="border-color:var(--accent)">activations decode to: <b>${fmtYears(t.predY)}</b>${verdict}</span>`;
}
function renderConv(){
  const s = M().samples[state.sample];
  const turns = s.turns.map(t => {
    const meta = t.role === "assistant" ? `
      <div class="turnmeta">
        ${t.step != null ? `<span class="chipx">Step ${t.step}</span>` : `<span class="chipx">${t.i===1?"overview":"—"}</span>`}
        ${t.shText ? `<span class="chipx">model wrote: <b>${fmtYears(t.shYears)}</b> (“${esc(t.shText)}”)</span>` : ""}
        ${t.predY != null ? predChip(t) : ""}
        ${t.trunc ? `<span class="chipx warn">truncated</span>` : ""}
        ${t.forced ? `<span class="chipx warn">think force-closed</span>` : ""}
      </div>` : "";
    return `<div class="turn ${t.role}">
        <div class="avatar">${t.role}<br><span class="mono">#${t.i}</span></div>
        <div class="bubble">${esc(t.text)}</div></div>${meta}`;
  }).join("");
  return `<div class="pane left">${sampleList()}</div>
    <div class="pane right">
      <div class="kv">
        <span class="chipx"><b>${esc(s.task)}</b> · ${esc(s.hLabel)} · ${esc(s.phrasing)}</span>
        <span class="chipx" style="border-color:var(--accent)">step semantics: <b>${(s.turns[0].text||"").includes("Time assignments:") ? "CONTROL (silent steps; targets assigned in final turn)" : (s.turns[0].text||"").includes("Time target:") ? "TARGET (how far in the future)" : "DURATION (how long the step takes)"}</b></span>
        <span class="chipx">${s.turns.length} turns · ${s.nTok} tokens</span>
        <span class="chipx">${s.completed ? "reached “Plan Completed”" : "turn budget hit"}</span>
      </div>${turns}</div>`;
}

/* ---------- tab 3: boundaries ---------- */
function renderBounds(){
  const s = M().samples[state.sample];
  const lanes = KIND_ORDER.filter(k => s.bounds.some(b=>b.k===k)).map(k => {
    const marks = s.bounds.filter(b=>b.k===k).map(b =>
      `<div class="mark ${b.r==="user"?"user":""}" data-p="${b.p}" data-info="${esc(b.tok)} · ${b.r} · turn ${b.t}${b.s!=null?" · step "+b.s:""}" style="left:${(b.p/s.nTok*100).toFixed(2)}%"></div>`).join("");
    return `<div class="lane"><div class="lname">${k}</div><div class="track">${marks}</div></div>`;
  }).join("");
  const rows = s.bounds.map(b => `<tr>
      <td class="num">${b.p}</td><td class="mono">${esc(b.k)}</td>
      <td class="mono">${esc(JSON.stringify(b.tok)).slice(1,-1)}</td>
      <td>${esc(b.r)}</td><td class="num">${b.t}</td><td class="num">${b.s??"—"}</td></tr>`).join("");
  return `<div class="pane left">${sampleList()}</div>
    <div class="pane right">
      <div class="kv"><span class="chipx"><b>${esc(s.promptId)}</b></span>
        <span class="chipx">${s.bounds.length} boundary tokens over ${s.nTok} positions</span>
        <span class="chipx">captured at layers ${Object.values(M().depthToLayer).join(", ")}</span></div>
      <div class="lanes">${lanes}
        <div class="hint" style="margin:4px 0 8px">x = absolute token position · teal = assistant/system turn · gray = user · hover a mark</div></div>
      <div class="panelbox" style="margin-top:14px"><div class="panelhead">boundary table</div>
      <div class="scrollx"><table><thead><tr><th>abs pos</th><th>kind</th><th>token</th><th>role</th><th>turn</th><th>step</th></tr></thead>
      <tbody>${rows}</tbody></table></div></div>
    </div>`;
}
function wireBounds(){
  const tip = document.getElementById("tip");
  document.querySelectorAll(".mark").forEach(m => {
    m.onmouseenter = e => { tip.style.display="block";
      tip.innerHTML = `<b>pos ${m.dataset.p}</b><span class="mono">${m.dataset.info}</span>`; };
    m.onmousemove = e => { tip.style.left=(e.clientX+14)+"px"; tip.style.top=(e.clientY+10)+"px"; };
    m.onmouseleave = () => tip.style.display="none";
  });
}

/* ---------- tab 4: geometry 3D ---------- */
let rot = {x:-0.45, y:0.65}, zoom = 1.0, dragging=false, last=null, animId=null;
function syncGeoOptions(){
  const g = state.geo, kinds = Object.keys(M().kinds);
  if (!kinds.includes(g.kind)) g.kind = kinds[0];
}
function geoFit(){
  const g = state.geo;
  const layers = Object.values(M().depthToLayer);
  const layer = layers[g.depth];

function unpackI16(b64){ // base64 little-endian int16 -> Int16Array

function wireGeo(){

    let hit=null;

  const prow = probes.map(r=>`<tr>
    <td class="num">${Math.round(r.depth*100)}% · L${r.layer}</td><td class="mono">${esc(r.kind)}</td>
    <td>${label(r.target)}</td><td>${esc(r.scheme)}</td><td class="num">${r.n}</td>
    <td class="num"><b>${r.r2.toFixed(3)}</b></td><td class="num">${r.rho.toFixed(2)}</td>
    <td class="num">${r.p === 0 ? "<1e-300" : r.p.toExponential(1)}</td></tr>`).join("");
  const fseg = [["step","step horizon"],["target","total horizon"],["all","both"]].map(([v,l])=>
    `<button class="${statsFilter===v?"on":""}" data-sf="${v}">${l}</button>`).join("");
  const hrow = M().horizon.map(r=>{
    const best = Object.entries(r.spearman_log_horizon).sort((a,b)=>Math.abs(b[1].rho)-Math.abs(a[1].rho))[0];
    return best?`<tr><td class="mono">${esc(r.slice)}</td><td>${esc(r.coloring)}</td>
      <td class="num">${r.n}</td><td class="mono">${best[0]}</td>
      <td class="num">${best[1].rho.toFixed(2)}</td><td class="num">${best[1].p === 0 ? "<1e-300" : best[1].p.toExponential(1)}</td></tr>`:"";
  }).join("");
  return `<div class="pane right">
    <div class="panelbox"><div class="panelhead">ridge probes — activation → log(horizon) ·
      predicting <span class="seg" style="margin:0 8px">${fseg}</span> · click headers to sort</div>
    <div class="scrollx" style="max-height:44vh"><table>
      <thead><tr><th data-k="depth">depth</th><th data-k="kind">token</th><th data-k="target">predicting</th>
      <th data-k="scheme">scheme</th><th data-k="n">n</th><th data-k="r2">R²</th><th data-k="rho">Spearman rho</th><th data-k="p">p-value</th></tr></thead>
      <tbody>${prow}</tbody></table></div></div>
    <div class="panelbox" style="margin-top:14px"><div class="panelhead">PCA Spearman (log horizon vs PCs) — task-centered slices</div>
    <div class="scrollx" style="max-height:34vh"><table>
      <thead><tr><th>slice</th><th>coloring</th><th>n</th><th>best PC</th><th>Spearman rho</th><th>p-value</th></tr></thead>
      <tbody>${hrow}</tbody></table></div></div></div>`;
}
function wireStats(){
  document.querySelectorAll("th[data-k]").forEach(th => th.onclick = () => {
    const k = th.dataset.k;
    if (sortKey === k) sortDir *= -1; else { sortKey = k; sortDir = -1; }
    render();
  });
  document.querySelectorAll("[data-sf]").forEach(b => b.onclick = () => {
    statsFilter = b.dataset.sf; render();
  });
}

/* ---------- tab 6: MFA regions ---------- */
function renderMfa(){
  const mfa = M().mfa;
  if (!mfa) return `<div class="pane right"><p class="hint">No MFA fit for this
    model. The region decomposition was run on the default (rollout) entry —
    switch models top-right, or run experiments/mfa_regions.py for another run.</p></div>`;
  const K = mfa.K;
  const hue = r => `hsl(${Math.round(r / K * 360)}, 62%, 55%)`;
  const nmiRows = Object.entries(mfa.nmi).sort((a,b)=>b[1]-a[1]).map(([v,s])=>`
    <tr><td>${esc(v)}</td>
    <td><div class="barwrap" style="background:var(--chip);border-radius:3px;height:8px;width:160px;display:inline-block;margin-right:10px"><div style="background:var(--accent);height:100%;border-radius:3px;width:${(s*100).toFixed(0)}%"></div></div><span class="num">${s.toFixed(3)}</span></td></tr>`).join("");
  const regRows = mfa.regions.map(r => {
    const lf = r.local_horizon_factor;
    return `<tr>
      <td><span class="sw" style="background:${hue(r.region)};display:inline-block;vertical-align:-1px;margin-right:6px"></span><span class="mono">R${String(r.region).padStart(2,"0")}</span></td>
      <td class="num">${r.n}</td><td class="mono">${esc(r.kind)}</td>
      <td>${esc(r.phase)}</td><td>${esc(r.task)}</td>
      <td class="num">${lf ? `z${lf.factor} · ρ=${lf.rho>0?"+":""}${lf.rho.toFixed(2)} (n=${lf.n_steps})` : "—"}</td></tr>`;
  }).join("");
  return `<div class="pane right">
    <div class="kv">
      <span class="chipx">method <b>Mixture of Factor Analyzers</b> — Shafran et al., arXiv:2602.02464 (authors' code)</span>
      <span class="chipx">K=<b>${mfa.K}</b> regions · rank <b>${mfa.rank}</b></span>
      <span class="chipx">n=<b>${mfa.n}</b> assistant boundary tokens · layer <b>${mfa.layer}</b></span>
      <span class="chipx">mean assignment confidence <b>${mfa.mean_confidence.toFixed(2)}</b></span>
    </div>
    <p class="hint" style="max-width:80ch">Unsupervised Gaussian-region decomposition of activation space.
    Headline: <b>regions encode structure, not time</b> — every region is pure in token kind and organized
    by conversation phase, while task and horizon are invisible at region level (NMI table). The horizon
    instead appears as a <b>local direction inside regions</b>: in most regions one of the ${mfa.rank} local
    factors correlates with log step horizon (last column). Use color = "MFA region" in the Geometry tab
    to see the regions against the horizon gradient.</p>
    ${mfa.viz ? `<div class="panelbox" style="margin-bottom:16px"><div class="panelhead">activation space by region —
      pooled PCA-3D of all ${mfa.n} boundary tokens · ● = region centroids · labels = step horizons written at sampled points
      <span class="evr" style="margin-left:10px">EVR ${mfa.viz.evr.map(v=>(v*100).toFixed(0)+"%").join(" · ")}</span></div>
      <div style="padding:8px"><canvas id="mfa3d" style="width:100%;height:440px;background:var(--surface);border-radius:6px;cursor:grab;touch-action:none"></canvas>
      <div class="hint" style="margin-top:6px">drag to rotate · wheel to zoom — the paper-style view: each Gaussian region is one colored cloud (here: one token-kind × phase cell), and time-horizon labels scatter <i>within</i> clouds rather than across them</div></div></div>` : ""}
    <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start">
      <div class="panelbox"><div class="panelhead">region map — where regions live (dot area = size)</div>
        <div style="padding:10px 14px">${mfaRegionMap(mfa)}</div></div>
      <div class="panelbox"><div class="panelhead">region ↔ variable alignment (NMI, 0–1)</div>
        <table><thead><tr><th>variable</th><th>NMI</th></tr></thead><tbody>${nmiRows}</tbody></table></div>
    </div>
    <div class="panelbox" style="margin-top:16px"><div class="panelhead">local time direction —
      factor coordinate vs step horizon, per region
      <select id="mfaRegSel" style="margin-left:12px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:3px 8px"></select>
      <span class="evr" id="mfaRho" style="margin-left:10px"></span></div>
      <div style="padding:10px 14px"><canvas id="mfaScatter" style="width:100%;height:320px;background:var(--surface);border-radius:6px"></canvas>
      <div class="hint" style="margin-top:6px">each point is one plan step in this region: x = its coordinate on the region's best local factor, y = the step horizon it wrote (log scale). A sloped cloud = this region carries a local time axis.</div></div>
    </div>
    <div class="panelbox" style="margin-top:16px"><div class="panelhead">regions — majority composition + local horizon factor</div>
      <div class="scrollx" style="max-height:60vh"><table>
      <thead><tr><th>region</th><th>n</th><th>token kind</th><th>phase</th><th>top task</th><th>best local factor ~ log step horizon</th></tr></thead>
      <tbody>${regRows}</tbody></table></div></div>
    </div>`;
}
function mfaRegionMap(mfa){
  const K = mfa.K, hue = r => `hsl(${Math.round(r / K * 360)}, 62%, 55%)`;
  const kinds = KIND_UI_ORDER.filter(k => mfa.regions.some(r => r.kind.startsWith(k)));
  const phases = ["opening","early","mid","late"];
  const maxN = Math.max(...mfa.regions.map(r=>r.n));
  const cell = (kind, ph) => mfa.regions
    .filter(r => r.kind.startsWith(kind) && r.phase.startsWith(ph))
    .map(r => { const d = Math.max(10, Math.round(34*Math.sqrt(r.n/maxN)));
      return `<span title="R${r.region} n=${r.n}" style="display:inline-block;width:${d}px;height:${d}px;border-radius:50%;background:${hue(r.region)};margin:2px;vertical-align:middle"></span>`; })
    .join("") || `<span class="evr">—</span>`;
  return `<table style="border-collapse:collapse">
    <thead><tr><th></th>${phases.map(p=>`<th style="padding:4px 10px">${p}</th>`).join("")}</tr></thead>
    <tbody>${kinds.map(k=>`<tr><td class="mono" style="padding:4px 10px;text-align:right">${k}</td>
      ${phases.map(p=>`<td style="padding:4px 10px;text-align:center">${cell(k,p)}</td>`).join("")}</tr>`).join("")}</tbody></table>
    <div class="hint" style="margin-top:6px">every region sits in exactly one token-kind row; columns are its dominant conversation phase — the unsupervised fit rediscovered the kind × phase grid</div>`;
}
function drawMfaScatter(regId){
  const mfa = M().mfa, cv = document.getElementById("mfaScatter");
  if (!mfa || !cv) return;
  const pts = [];
  for (const kd of Object.values(M().kinds))
    for (const r of kd.rows)
      if (r.reg === regId && r.zb != null && r.shY != null && r.shY > 0)
        pts.push([r.zb, Math.log(r.shY)]);
  const dpr = devicePixelRatio||1, w = cv.clientWidth, h = cv.clientHeight;
  cv.width = w*dpr; cv.height = h*dpr;
  const ctx = cv.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  const style = getComputedStyle(document.documentElement);
  ctx.font = "11px ui-monospace, Menlo, monospace";
  const rho = document.getElementById("mfaRho");
  if (pts.length < 10){ ctx.fillStyle = style.getPropertyValue("--ink3");
    ctx.fillText("not enough step points with factor coordinates in this region", 16, 24);
    if (rho) rho.textContent = ""; return; }
  const xs = pts.map(p=>p[0]), ys = pts.map(p=>p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const PX = v => 46 + (v-x0)/((x1-x0)||1)*(w-66);
  const PY = v => h-28 - (v-y0)/((y1-y0)||1)*(h-48);
  // axes + y tick labels in human time
  ctx.strokeStyle = style.getPropertyValue("--line"); ctx.lineWidth = 1;
  ctx.strokeRect(46, 20, w-66, h-48);
  ctx.fillStyle = style.getPropertyValue("--ink3");
  for (const f of [0, 0.5, 1]){
    const v = y0 + f*(y1-y0);
    ctx.fillText(fmtYears(Math.exp(v)), 4, PY(v)+4);
  }
  ctx.fillText("factor coordinate z", w/2-40, h-8);
  // least-squares line
  const mx = xs.reduce((a,b)=>a+b,0)/xs.length, my = ys.reduce((a,b)=>a+b,0)/ys.length;
  let sxy=0, sxx=0;
  for (const [x,y] of pts){ sxy += (x-mx)*(y-my); sxx += (x-mx)*(x-mx); }
  const slope = sxy/(sxx||1), icpt = my - slope*mx;
  ctx.strokeStyle = style.getPropertyValue("--accent"); ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(PX(x0), PY(icpt+slope*x0)); ctx.lineTo(PX(x1), PY(icpt+slope*x1)); ctx.stroke();
  // points
  const K = mfa.K;
  ctx.fillStyle = `hsl(${Math.round(regId/K*360)}, 62%, 55%)`;
  for (const [x,y] of pts){ ctx.beginPath(); ctx.arc(PX(x), PY(y), 3, 0, 7); ctx.fill(); }
  const reg = mfa.regions.find(r=>r.region===regId), lf = reg && reg.local_horizon_factor;
  if (rho) rho.textContent = lf ? `n=${pts.length} · Spearman ρ=${lf.rho>0?"+":""}${lf.rho.toFixed(2)} (factor z${lf.factor})` : `n=${pts.length}`;
}

let mfaRot = {x:-0.4, y:0.7}, mfaZoom = 1.0;
function drawMfa3d(){
  const mfa = M().mfa, cv = document.getElementById("mfa3d");
  if (!mfa || !mfa.viz || !cv) return;
  const viz = mfa.viz, K = mfa.K;
  const dpr = devicePixelRatio||1, w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== w*dpr){ cv.width = w*dpr; cv.height = h*dpr; }
  const ctx = cv.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  const style = getComputedStyle(document.documentElement);
  const cx=w/2, cy=h/2, S=Math.min(w,h)*0.30*mfaZoom, D=4.2;
  const cX=Math.cos(mfaRot.x), sX=Math.sin(mfaRot.x), cY=Math.cos(mfaRot.y), sY=Math.sin(mfaRot.y);
  const proj = ([x,y,z]) => {
    x/=100;y/=100;z/=100;
    const x1 = x*cY + z*sY, z1 = -x*sY + z*cY;
    const y1 = y*cX - z1*sX, z2 = y*sX + z1*cX;
    const f = D/(D - z2);
    return [cx + x1*S*f, cy - y1*S*f, z2, f];
  };
  const hue = r => `hsl(${Math.round(r/K*360)}, 62%, 55%)`;
  // points (depth-sorted)
  const order = viz.pts.map((p,i)=>({i, P: proj(p)})).sort((a,b)=>a.P[2]-b.P[2]);
  const surface = style.getPropertyValue("--surface").trim() || "#111";
  for (const {i, P} of order){
    ctx.beginPath(); ctx.arc(P[0], P[1], 2.4*P[3], 0, 7);
    ctx.fillStyle = hue(viz.reg[i]); ctx.globalAlpha = 0.8; ctx.fill();
  }
  ctx.globalAlpha = 1;
  // centroids: black dots + R# labels
  ctx.font = "10.5px ui-monospace, Menlo, monospace";
  viz.cent.forEach((c, k) => {
    const P = proj(c);
    ctx.beginPath(); ctx.arc(P[0], P[1], 5*P[3], 0, 7);
    ctx.fillStyle = style.getPropertyValue("--ink"); ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = surface; ctx.stroke();
    ctx.fillStyle = style.getPropertyValue("--ink");
    ctx.fillText("R"+k, P[0]+6, P[1]-5);
  });
  // sparse step-horizon labels
  ctx.fillStyle = style.getPropertyValue("--ink2");
  for (const lb of viz.labels){
    const P = proj(viz.pts[lb.i]);
    ctx.fillText(lb.t, P[0]+4, P[1]+3);
  }
}
function wireMfa3d(){
  const cv = document.getElementById("mfa3d");
  if (!cv) return;
  let drag=false, last=null;
  cv.onpointerdown = e => { drag=true; last=[e.clientX,e.clientY]; cv.setPointerCapture(e.pointerId); cv.style.cursor="grabbing"; };
  cv.onpointerup = () => { drag=false; cv.style.cursor="grab"; };
  cv.onpointermove = e => { if (!drag||!last) return;
    mfaRot.y += (e.clientX-last[0])*0.008; mfaRot.x += (e.clientY-last[1])*0.008;
    mfaRot.x = Math.max(-1.5, Math.min(1.5, mfaRot.x));
    last=[e.clientX,e.clientY]; drawMfa3d(); };
  cv.onwheel = e => { e.preventDefault(); mfaZoom = Math.max(0.4, Math.min(3.5, mfaZoom*(e.deltaY<0?1.08:0.93))); drawMfa3d(); };
  drawMfa3d();
}
function wireMfa(){
  const mfa = M().mfa, sel = document.getElementById("mfaRegSel");
  wireMfa3d();
  if (!mfa || !sel) return;
  const regs = mfa.regions.filter(r => r.local_horizon_factor)
    .sort((a,b)=>Math.abs(b.local_horizon_factor.rho)-Math.abs(a.local_horizon_factor.rho));
  sel.innerHTML = regs.map(r =>
    `<option value="${r.region}">R${r.region} — ${r.kind.split(" ")[0]} ${r.phase.split(" ")[0]} (ρ=${r.local_horizon_factor.rho>0?"+":""}${r.local_horizon_factor.rho.toFixed(2)})</option>`).join("");
  sel.onchange = () => drawMfaScatter(+sel.value);
  if (regs.length) drawMfaScatter(regs[0].region);
}

/* ---------- render ---------- */
function render(){
  renderHeader();
  const main = document.getElementById("main");
  if (state.tab==="prompts"){ main.innerHTML = renderPrompts(); wirePrompts(); }
  else if (state.tab==="conv"){ main.innerHTML = renderConv(); wireSampleList(); }
  else if (state.tab==="bounds"){ main.innerHTML = renderBounds(); wireSampleList(); wireBounds(); }
  else if (state.tab==="geo"){ main.innerHTML = renderGeo(); wireGeo(); }
  else if (state.tab==="mfa"){ main.innerHTML = renderMfa(); wireMfa(); }
  else { main.innerHTML = renderStats(); wireStats(); }
}
window.addEventListener("resize", () => { if (state.tab==="geo") draw3d(); });
syncGeoOptions();
render();
</script>
