[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "temporal-manifolds"
version = "0.1.0"
description = "Experiments on the geometric structure of LLM residual-stream activations under temporal/planning-horizon phrasings."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "google-cloud-storage>=2.18.0",
    "google-auth>=2.0.0",
    "joblib>=1.4.0",
    "torch>=2.7.1,<2.8.0",
    "transformers>=4.40.0",
    "einops>=0.6.0",
    "numpy>=2.5.1,<3.0.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.6.0,<2.0.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.2.0",
    "plotly>=5.24.0",
    "streamlit>=1.59.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "black>=24.0", "nbstripout>=0.7"]

[project.scripts]
temporal-manifolds-workflow = "temporal_manifolds.workflows:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["temporal_manifolds*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.uv]
prerelease = "allow"

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
